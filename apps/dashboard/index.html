<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flaghoist admin</title>
    <meta name="color-scheme" content="light dark" />
    <!--
      No external font requests. This console is deployed inside the operator's own infrastructure,
      and a self-hosted admin UI that fetches assets from a third party on every load undercuts the
      compliance boundary the product is sold on, and breaks entirely on an egress-restricted or
      air-gapped network. Fonts are bundled into this single file instead.
    -->
    <script>
      // Apply a stored theme before first paint so a chosen theme never flashes the other one. The
      // design system flips on the `dark` class, so we set that rather than a color-scheme attribute.
      try {
        var t = localStorage.getItem('flaghoist.theme')
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.classList.toggle('dark', t === 'dark')
      } catch (e) {
        /* private mode: fall through to light */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
