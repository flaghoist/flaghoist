<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flaghoist — hoist your own feature flags">
  <title>Flaghoist — hoist your own feature flags</title>
  <rect width="1280" height="400" fill="#0B1E3A" />
  <!-- faint signal-flag bunting motif, top-right -->
  <g fill-opacity="0.06" fill="#F7F4EC">
    <path d="M980 0 L1040 0 L1025 26 L1040 52 L980 52 Z" />
    <path d="M1070 0 L1130 0 L1115 26 L1130 52 L1070 52 Z" />
    <path d="M1160 0 L1220 0 L1205 26 L1220 52 L1160 52 Z" />
  </g>
  <!-- mark -->
  <g transform="translate(150 150) scale(2.1)">
    <circle cx="16" cy="9" r="3" fill="#F7F4EC" />
    <line x1="16" y1="9" x2="16" y2="57" stroke="#F7F4EC" stroke-width="3.5" stroke-linecap="round" />
    <path d="M16 13 L52 15.5 L40.5 24 L52 32.5 L16 31 Z" fill="#FF4A1F" />
    <path d="M16 31 L40.5 24 L52 32.5 L16 31 Z" fill="#F7F4EC" fill-opacity="0.18" />
  </g>
  <text x="290" y="196" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="600" letter-spacing="-1.5" fill="#F7F4EC">Flag<tspan fill="#FF4A1F">hoist</tspan></text>
  <text x="292" y="248" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="400" fill="#AEBACB">Hoist your own feature flags.</text>
  <text x="292" y="300" font-family="'SF Mono', ui-monospace, 'Menlo', monospace" font-size="18" font-weight="400" fill="#8B9AB0">OpenFeature-native · self-hosted · $0 idle · bring your own DB</text>
</svg>
