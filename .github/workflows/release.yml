name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Changesets release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          # v2 renamed these from `version` and `publish`. Under the old names the action still
          # runs, versions nothing it should not, and silently never publishes.
          version-script: pnpm version-packages
          publish-script: pnpm release
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # setup-node's registry-url writes an .npmrc holding _authToken=${NODE_AUTH_TOKEN} and
          # points NPM_CONFIG_USERCONFIG at it, so the token has to arrive under that name too.
          # With only NPM_TOKEN set the variable never expands, every request goes out
          # unauthenticated, and npm answers 404 rather than 401 for scoped packages.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance is NOT produced by this workflow, and setting NPM_CONFIG_PROVENANCE here does
          # nothing. `changeset publish` runs `npm pack` and then `npm publish <tarball>`, and npm
          # does not generate a provenance attestation when publishing a pre-packed tarball: it only
          # does so when publishing from the package directory. Confirmed on the 0.2.0 release, which
          # published cleanly with the flag set, printed no "Signed provenance statement" line, and
          # produced no attestation (the attestation endpoint 404s). This is changesets#1152.
          #
          # To get provenance, publish each package from its own directory with `npm publish` (no
          # pack), rather than through `changeset publish`, or wait for changesets to support it.
          # The id-token: write permission above is already in place for whenever that happens.
