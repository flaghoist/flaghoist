name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Changesets release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          # v2 renamed these from `version` and `publish`. Under the old names the action still
          # runs, versions nothing it should not, and silently never publishes.
          version-script: pnpm version-packages
          publish-script: pnpm release
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # setup-node's registry-url writes an .npmrc holding _authToken=${NODE_AUTH_TOKEN} and
          # points NPM_CONFIG_USERCONFIG at it, so the token has to arrive under that name too.
          # With only NPM_TOKEN set the variable never expands, every request goes out
          # unauthenticated, and npm answers 404 rather than 401 for scoped packages.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance is off because npm can only attest it from a public repo, and this one is
          # deliberately private through the alpha. Turn it back on at the public flip; the
          # id-token permission above is already in place for it. Tracked in LAUNCH.md Phase 2.
          # NPM_CONFIG_PROVENANCE: true
