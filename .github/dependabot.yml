version: 2
updates:
  # Dev toolchain and package dependencies across the monorepo
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Two grouped PRs a week instead of one per package. Majors stay ungrouped on purpose:
      # they are the ones that need reading, and burying them in a group of twelve is how a
      # breaking change gets merged unread.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # TypeScript 7 (the Go compiler rewrite) breaks .d.ts generation in our build toolchain —
      # tsup/rollup-plugin-dts fails with "Cannot read properties of undefined (reading
      # 'useCaseSensitiveFileNames')" in core, provider-node, and provider-web. Nothing to fix on
      # our side; it needs upstream bundler support. Drop this ignore and retry once tsup ships a
      # TS7-compatible release. Minor and patch updates to TypeScript 5.x still come through.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # GitHub Actions used in CI/release workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
